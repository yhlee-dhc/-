const keys = [

  [0.92, [2.1, 1.5, 2.6], [1.4, 0.85, 0.6]],
  [1.5, [0.0, 1.15, 2.7], [0, 0.82, 0]],

// ---------- UI ----------
const $ = id => document.getElementById(id);

const toScreen = v => { const p = v.clone().project(camera); return [(p.x * 0.5 + 0.5) * 1920, (-p.y * 0.5 + 0.5) * 1080]; };
// output seconds -> source timeline seconds (scene times per spec)
const MAP = [[0, 0], [1.0, 1.5], [3.0, 4.6], [5.0, 6.6], [8.0, 11.8], [10, 15]];
function remap(o) { for (let k = 0; k < MAP.length - 1; k++) { const [o0, s0] = MAP[k], [o1, s1] = MAP[k + 1]; if (o <= o1) return s0 + (s1 - s0) * (o - o0) / (o1 - o0); } return 15; }

// ---------- frame ----------
const dummy = new THREE.Object3D(); const tmpC = new THREE.Color();
window.renderAt = function (out) {
  const t = remap(out);
  const [cp, cq] = camAt(t);
  const shake = t > T.seal1 ? 0.006 * Math.exp(-(t - T.seal1) * 8) : 0;
  cp.x += shake * Math.sin(t * 90); cp.y += shake * Math.cos(t * 77);
  camera.position.copy(cp); camera.lookAt(cq); camera.updateMatrixWorld();

  const cutZ = t < T.cut0 ? 14 : t > T.cut1 ? 0 : lerp(14, 0, eio((t - T.cut0) / (T.cut1 - T.cut0)));
  gum.position.z = mucus.position.z = cutZ; gum.scale.z = mucus.scale.z = cutZ + 6;
  const ff = Math.min(1.5, cutZ); film.position.z = ff; film.scale.z = ff + 1.5;

  const sw = swell(t);
  filmMat.color.set('#f5b000').lerp(tmpC.set('#ffcc1f'), sw);
  filmMat.roughness = lerp(0.88, 0.06, sw); filmMat.clearcoat = sw; filmMat.clearcoatRoughness = 0.04;
  filmMat.opacity = lerp(1.0, 0.58, sw);
  filmMat.emissiveIntensity = 0.02 + 0.45 * sw + (t > T.seal1 ? 0.3 * Math.exp(-(t - T.seal1) * 6) : 0);
  filmMat.depthWrite = sw < 0.3;
  const wv = clamp((t - T.swell0) / (T.swell1 - T.swell0));
  filmU.uWave.value = sstep(T.swell0, T.swell0 + 0.3, t) * (1 - sstep(T.swell1 - 0.2, T.swell1 + 0.2, t));
  filmU.uWaveP.value = lerp(-0.3, 1.3, (wv * 1.8) % 1); filmU.uWave2P.value = lerp(-0.3, 1.3, ((wv * 1.8) + 0.5) % 1);
  filmU.uFrontAmt.value = 0;
  updateFilm(t);

  const pulse = t > T.seal1 ? Math.exp(-(t - T.seal1) * 5) : 0;
  mucMat.emissiveIntensity = 0.05 + 0.25 * sstep(T.str0, T.seal1, t) * (1 - 0.5 * sstep(6.4, 7.4, t)) + 0.6 * pulse;
  mucMat.opacity = 0.26 + 0.12 * sstep(T.str0, T.seal1, t);
  surfMat.opacity = 0.9 * win(out, 6.2, 8.3, 0.3);

  // chains
  chainMat.opacity = (1 - 0.5 * sstep(6.6, 7.4, t)) * (1 - sstep(11.9, 12.5, t)); chainMat.emissiveIntensity = 0.35 + 0.5 * sw;
  for (const c of chains) { c.m.visible = t > 1.2 && t < 12.6; if (c.m.visible) buildChain(c, t); }

  }

  // saliva
  for (const d of drops) {

    const target = [d.tx, tb + 0.01 + d.tu * 0.04, d.tz];
    const mid = [(d.start[0] + target[0]) / 2, Math.max(d.start[1], target[1]) + 0.25, (d.start[2] + target[2]) / 2];
    const e = eoc(k); const q = (a, b, c) => (1 - e) * (1 - e) * a + 2 * (1 - e) * e * b + e * e * c;
    const absorb = sstep(0.82, 1.0, k); const sc = d.r * (1 - absorb) * (k > 0 ? 1 : 0) * (1 + 0.08 * Math.sin(t * 14 + d.t0 * 9));
    d.m.visible = sc > 0.0005;

    d.m.scale.set(sc * (1 + 0.25 * absorb), sc * (1 - 0.3 * absorb), sc);
    d.halo.position.set(target[0], target[1] - 0.005, target[2] + 0.02);

  }

  const pk = clamp((t - T.seal1) / 0.9), pxp = eoc(pk) * 1.7, po = t > T.seal1 ? (1 - pk) : 0;
  pulseL.position.set(-pxp, ys(-pxp) + MUC * 0.6, 0.03); pulseR.position.set(pxp, ys(pxp) + MUC * 0.6, 0.03);
  pulseL.material.opacity = pulseR.material.opacity = 0.9 * po; pulseL.scale.set(0.35, 0.12, 1); pulseR.scale.set(0.35, 0.12, 1);
  pulseC.position.set(0.7, ys(0.7) + MUC, 0.04); pulseC.material.opacity = 0.8 * (t > T.seal1 ? Math.exp(-(t - T.seal1) * 7) : 0); pulseC.scale.set(0.5, 0.16, 1);

  // ingredients
  const cnt = [0, 0, 0, 0, 0];
  parts.forEach((p, i) => {
    const s = partState(p, t); let sc = s.scale;
    const hero = heroes.find(h => h.pi === i);
    if (hero && t > T.hero + hero.slot * 0.07) sc = 0;
    dummy.position.set(s.x, s.y, s.z); dummy.scale.setScalar(sc); dummy.updateMatrix(); pInst[p.g].setMatrixAt(cnt[p.g]++, dummy.matrix);
    for (let j = 0; j < TR; j++) {
      const sj = partState(p, t - (j + 1) * 0.03);
      const moving = sj.k > 0 && sj.k < 1 ? 1 : (s.k > 0 && s.k < 1 ? 0.6 : 0);
      const f = (1 - j / TR) * moving * (sc > 0 ? 1 : 0);
      dummy.position.set(sj.x, sj.y, sj.z + 0.001); dummy.scale.setScalar(sj.scale * (1.25 - j * 0.09)); dummy.updateMatrix();
      trail.setMatrixAt(i * TR + j, dummy.matrix); trail.setColorAt(i * TR + j, tmpC.set(PCOL[p.g]).multiplyScalar(0.55 * f));

  pMats.forEach((m, g) => { m.emissiveIntensity = 0.12 + 0.5 * sstep(T.rel0, T.rel0 + 0.5, t) + 1.6 * win(t, hiStart(g), hiStart(g) + 0.95, 0.2); });

  // heroes
  heroes.forEach((h, g) => {
    const tb = T.hero + h.slot * 0.07; const k = clamp((t - tb) / 0.65); h.m.visible = t > tb;
    const p0 = partState(parts[h.pi], tb);
    const pos = v3([p0.x, p0.y, p0.z]).lerp(v3(heroFinal[h.slot]), eoc(k)); pos.y += 0.05 * Math.sin(t * 2.2 + g) * k;
    h.m.position.copy(pos); const rr = lerp(p0.scale, 0.33, eob(clamp((t - tb) / 0.5))); h.m.scale.setScalar(rr); h.m.rotation.y = t * 0.6;
    h.halo.position.copy(pos).add(new THREE.Vector3(0, 0, -0.05));
    const flash = t > tb ? Math.exp(-(t - tb) * 6) : 0; h.halo.material.opacity = t > tb ? 0.32 + 0.65 * flash : 0; h.halo.scale.setScalar(rr * (3.0 + 4 * flash));
    h.screen = toScreen(pos); h.rs = toScreen(pos.clone().add(new THREE.Vector3(rr, 0, 0)))[0] - h.screen[0];
  });
  scene.fog.density = 0.16 * sstep(T.fog0, T.fog1, t);
  bokeh.forEach(b => { b.s.position.set(b.p[0] + 0.3 * Math.sin(t * 0.4 + b.ph), b.p[1] + 0.2 * Math.cos(t * 0.5 + b.ph), b.p[2]); b.s.scale.setScalar(b.sc); });

  finalPass.uniforms.uSweep.value = lerp(-0.6, 1.8, clamp((t - T.sweep0) / 0.45));
  finalPass.uniforms.uSweepAmt.value = sstep(T.sweep0 - 0.05, T.sweep0 + 0.05, t) * (1 - sstep(T.sweep0 + 0.35, T.sweep0 + 0.45, t)) * 1.3;
  finalPass.uniforms.uFlare.value = 0.38 * sstep(T.flare0, T.flare0 + 0.3, t) * (1 - 0.4 * sstep(14.7, 15, t));

  show($('st1'), win(out, 1.0, 3.0, 0.3)); show($('st2'), win(out, 3.0, 5.0, 0.3)); show($('st3'), win(out, 5.0, 8.0, 0.3));
  for (let g = 0; g < 5; g++) {
    const el = $('r' + g); const a = win(out, hiOut(g) - 0.15, 8.0, 0.3); const hi = win(out, hiOut(g), hiOut(g) + 0.55, 0.15);
    el.style.opacity = a; el.style.transform = `translateY(${(1 - a) * -24}px) scale(${1 + 0.05 * hi})`;
    el.style.boxShadow = `0 8px 28px rgba(200,40,80,.22), 0 0 0 ${4 * hi}px ${PCOL[g]}`;
  }
  show($('sf'), win(out, 6.3, 8.0, 0.3), 14);
  const labA = win(out, 8.25, 10.6, 0.3);
  heroes.forEach((h, g) => { const el = $('l' + g); const [x, y] = h.screen; el.style.left = x + 'px'; el.style.top = (y + h.rs + 50) + 'px'; el.style.opacity = labA; });
  { const a = win(out, 8.5, 10.6, 0.3); const el = $('tg'); el.style.opacity = a; el.style.transform = `translateX(-50%) translateY(${(1 - a) * 18}px)`; }

  composer.render();
  return true;
};
document.fonts.ready.then(async () => {
  await Promise.all(['500', '700', '900'].map(w => document.fonts.load(`${w} 20px KR`, '가나')).concat(['700', '900'].map(w => document.fonts.load(`${w} 20px KRL`, 'Ab'))));
  window.ready = true;
});
