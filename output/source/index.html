<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const params = new URLSearchParams(location.search);
const W = +(params.get('w') || 1920), H = +(params.get('h') || 1080);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eoc = t => 1 - Math.pow(1 - t, 3);
const eic = t => t * t * t;
const eob = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + (b - a) * rnd();

// gum surface profile
const ys = x => 1.0 - 0.06 * x * x;
const MUC = 0.06;           // mucus thickness
const FW = 1.6;             // film half width

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

// background gradient
function bgTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 288;
  const g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, 288);
  lg.addColorStop(0, '#ffe3dc'); lg.addColorStop(0.55, '#ffb9ae'); lg.addColorStop(1, '#f2938c');
  g.fillStyle = lg; g.fillRect(0, 0, 512, 288);
  const rg = g.createRadialGradient(256, 120, 10, 256, 120, 320);
  rg.addColorStop(0, 'rgba(255,248,240,0.75)'); rg.addColorStop(1, 'rgba(255,240,235,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 512, 288);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = bgTexture();
const fogColor = new THREE.Color('#ffc2b8');
scene.fog = new THREE.FogExp2(fogColor, 0.0);

const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 100);

// lights: bright, high-key, warm rim
scene.add(new THREE.HemisphereLight('#fff6ee', '#f4a7a7', 1.0));
const key = new THREE.DirectionalLight('#fff3e0', 2.4); key.position.set(3, 6, 6); scene.add(key);
const rim = new THREE.DirectionalLight('#ffc57a', 3.2); rim.position.set(-4, 3.5, -5); scene.add(rim);
const rim2 = new THREE.DirectionalLight('#ffd08a', 1.8); rim2.position.set(5, 2, -4); scene.add(rim2);
const fill = new THREE.DirectionalLight('#ffe6ea', 1.0); fill.position.set(0, -1, 6); scene.add(fill);

// ---------- textures ----------
function radialSprite(inner = 'rgba(255,255,255,1)', outer = 'rgba(255,255,255,0)') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, inner); rg.addColorStop(0.25, 'rgba(255,255,255,0.55)'); rg.addColorStop(1, outer);
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTex = radialSprite();

function noiseTex(size = 256, blur = 2) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const id = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++) { const v = 110 + rnd() * 145; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
  if (blur) { g.filter = `blur(${blur}px)`; g.drawImage(c, 0, 0); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// gum cross-section (cut face) texture, mapped to world x [-8,8], y [-6,1.2]
const GX0 = -8, GX1 = 8, GY0 = -6, GY1 = 1.2;
function tissueTex() {
  const w = 2048, h = 920; const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const id = g.createImageData(w, h);
  const epi = [248, 160, 166], con = [232, 112, 124], deep = [214, 92, 108];
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const x = GX0 + (px / w) * (GX1 - GX0), y = GY1 - (py / h) * (GY1 - GY0);
    const d = ys(x) - y; // depth below surface
    let col;
    if (d < 0.11) { const k = d / 0.11; col = epi.map((v, i) => v * (1 - k * 0.15) + con[i] * k * 0.15); }
    else { const k = clamp((d - 0.11) / 1.2); col = con.map((v, i) => lerp(v, deep[i], k)); }
    // fibres
    const f = Math.sin(x * 38 + Math.sin(y * 9) * 2.5 + d * 14) * 0.5 + 0.5;
    const fib = d > 0.13 ? Math.pow(f, 6) * 14 : 0;
    // basal ridges
    const ridge = Math.abs(d - (0.11 + 0.025 * Math.sin(x * 22))) < 0.008 ? 18 : 0;
    const n = (rnd() - 0.5) * 8;
    const i4 = (py * w + px) * 4;
    id.data[i4] = clamp(col[0] + fib + ridge + n, 0, 255);
    id.data[i4 + 1] = clamp(col[1] + fib * 0.7 + ridge * 0.8 + n, 0, 255);
    id.data[i4 + 2] = clamp(col[2] + fib * 0.7 + ridge * 0.8 + n, 0, 255);
    id.data[i4 + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(1 / (GX1 - GX0), 1 / (GY1 - GY0)); t.offset.set(-GX0 / (GX1 - GX0), -GY0 / (GY1 - GY0));
  t.anisotropy = 8;
  return t;
}

// ---------- gum ----------
function profileShape(topFn, botFn, x0, x1, n = 160) {
  const s = new THREE.Shape();
  for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n); i ? s.lineTo(x, topFn(x)) : s.moveTo(x, topFn(x)); }
  for (let i = n; i >= 0; i--) { const x = lerp(x0, x1, i / n); s.lineTo(x, botFn(x)); }
  return s;
}
function extrude(shape) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false, steps: 1, curveSegments: 1 });
  g.translate(0, 0, -1); return g;
}
const gumBump = noiseTex(256, 1.5); gumBump.repeat.set(3, 8);
const gumCap = new THREE.MeshPhysicalMaterial({ map: tissueTex(), roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.4, sheen: 0.4, sheenColor: new THREE.Color('#ffd0d4') });
const gumSide = new THREE.MeshPhysicalMaterial({ color: '#f2838b', roughness: 0.42, clearcoat: 0.9, clearcoatRoughness: 0.18, bumpMap: gumBump, bumpScale: 1.2, sheen: 0.6, sheenColor: new THREE.Color('#ffd6da') });
const gum = new THREE.Mesh(extrude(profileShape(ys, () => -6, -8, 8)), [gumCap, gumSide]);
scene.add(gum);

const mucMat = new THREE.MeshPhysicalMaterial({ color: '#dff2ff', transparent: true, opacity: 0.26, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.03, emissive: new THREE.Color('#bfe8ff'), emissiveIntensity: 0.05, depthWrite: false, side: THREE.DoubleSide });
const mucus = new THREE.Mesh(extrude(profileShape(x => ys(x) + MUC, x => ys(x) + 0.002, -8, 8)), mucMat);
mucus.renderOrder = 2;
scene.add(mucus);

// ---------- film (custom deformable slab) ----------
const NX = 140, NY = 12;
const fx = [], fv = [], fz = [], idx = [];
function addGrid(nu, nv, fn) { // fn(u,v) -> [x, rel, z]
  const base = fx.length;
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) { const [x, r, z] = fn(i / nu, j / nv); fx.push(x); fv.push(r); fz.push(z); }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = base + j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1; idx.push(a, b, d, a, d, c);
  }
}
const ux = u => lerp(-FW, FW, u);
addGrid(NX, NY, (u, v) => [ux(u), v, 0]);       // front (cut face)
addGrid(NX, NY, (u, v) => [ux(u), v, -1]);      // back
addGrid(NX, 6, (u, v) => [ux(u), 1, -v]);       // top
addGrid(NX, 6, (u, v) => [ux(u), 0, -v]);       // bottom
const filmGeo = new THREE.BufferGeometry();
const fPos = new Float32Array(fx.length * 3);
filmGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
filmGeo.setAttribute('rel', new THREE.BufferAttribute(new Float32Array(fv), 1));
filmGeo.setIndex(idx);

const filmMat = new THREE.MeshPhysicalMaterial({ color: '#f1bf2c', roughness: 0.85, clearcoat: 0, transparent: true, opacity: 1, side: THREE.DoubleSide, emissive: new THREE.Color('#ffb21a'), emissiveIntensity: 0.0, sheen: 0.3, sheenColor: new THREE.Color('#fff2b0') });
const filmU = { uWave: { value: 0 }, uWaveP: { value: -1 }, uWave2P: { value: -1 } };
filmMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, filmU);
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float rel; varying float vRel;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvRel = rel;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vRel; uniform float uWave; uniform float uWaveP; uniform float uWave2P;')
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float w1 = exp(-pow((vRel - uWaveP) / 0.13, 2.0));
      float w2 = exp(-pow((vRel - uWave2P) / 0.10, 2.0)) * 0.7;
      totalEmissiveRadiance += vec3(1.0, 0.86, 0.45) * uWave * (w1 + w2) * 2.2;`);
};
const film = new THREE.Mesh(filmGeo, filmMat);
film.renderOrder = 3;
scene.add(film);

// film state functions
const FLAT_B = ys(0) + MUC + 0.018;
function sealAmt(t) { if (t < 3.3) return 0; if (t > 4.15) return 1; return eic((t - 3.3) / 0.85); }
function bounce(t) { return t > 4.15 ? -0.006 * Math.exp(-(t - 4.15) * 9) * Math.sin((t - 4.15) * 38) : 0; }
function swell(t) { return eio(clamp((t - 1.15) / 1.8)); }
function edgeF(x) { return Math.pow(Math.max(0, 1 - Math.pow(Math.abs(x) / FW, 10)), 0.28); }
function filmBottom(x, t) { return lerp(FLAT_B, ys(x) + MUC - 0.002, sealAmt(t)) + bounce(t); }
function filmThick(x, t) {
  const sw = swell(t);
  const breathe = (t > 1.1 && t < 3.4) ? 0.006 * Math.sin((t - 1.1) * Math.PI * 2 * 1.3) * sw : 0;
  const T = 0.12 + 0.1 * sw + breathe - 0.012 * sealAmt(t) + 0.018 * sw * (1 - (x / FW) ** 2);
  return T * edgeF(x);
}
function updateFilm(t) {
  for (let i = 0; i < fx.length; i++) {
    const x = fx[i]; const b = filmBottom(x, t);
    fPos[i * 3] = x; fPos[i * 3 + 1] = b + fv[i] * filmThick(x, t); fPos[i * 3 + 2] = fz[i];
  }
  filmGeo.attributes.position.needsUpdate = true; filmGeo.computeVertexNormals();
}

// ---------- particles ----------
const PCOL = ['#cfd3de', '#c9a3ff', '#ffb36e', '#8ed8ff', '#9ff2b6'];
const pMats = PCOL.map(c => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05, emissive: new THREE.Color(c), emissiveIntensity: 0.12 }));
const sphereGeo = new THREE.SphereGeometry(1, 24, 16);
const PER = 13;
const parts = []; // {g, x, u, r, z, dx}
for (let g = 0; g < 5; g++) for (let k = 0; k < PER; k++) parts.push({ g, x: R(-1.42, 1.42), u: R(0.2, 0.8), r: R(0.015, 0.023), z: R(0.012, 0.03), dx: R(-0.06, 0.06), wob: R(0, 6.28) });
const pInst = PCOL.map((c, g) => { const m = new THREE.InstancedMesh(sphereGeo, pMats[g], PER); m.frustumCulled = false; scene.add(m); return m; });
const TR = 7;
const trailMat = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: true });
const trail = new THREE.InstancedMesh(sphereGeo, trailMat, parts.length * TR); trail.frustumCulled = false;
trail.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(parts.length * TR * 3), 3);
scene.add(trail);
// surface glow pools
const pools = parts.map(p => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: PCOL[p.g], blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 })); scene.add(s); return s; });

const DR_START = 4.62, DR_STAG = 0.21, DR_DUR = 0.62;
function partState(p, t) {
  const t0 = DR_START + p.g * DR_STAG;
  const k = clamp((t - t0) / DR_DUR);
  const e = eio(k);
  const glow = sstep(t0 - 0.18, t0 + 0.05, t);
  const scale = p.r * (1 + 0.35 * glow);
  const x = p.x + p.dx * e + 0.012 * Math.sin(p.wob + t * 3) * (1 - e);
  const yIn = filmBottom(p.x, t) + p.u * filmThick(p.x, t);
  const yRest = ys(x) + scale + 0.003; // rests ON gum surface, never below
  const y = lerp(yIn, yRest, e);
  return { x, y, z: p.z, scale, glow, k, t0 };
}

// ---------- saliva droplets ----------
const dropMat = new THREE.MeshPhysicalMaterial({ color: '#46aefc', roughness: 0.02, clearcoat: 1, clearcoatRoughness: 0.0, transparent: true, opacity: 0.82, emissive: new THREE.Color('#1d74e0'), emissiveIntensity: 0.35, envMapIntensity: 2.2, ior: 1.33, specularIntensity: 1 });
const drops = [];
for (let i = 0; i < 30; i++) {
  const side = i % 3; // 0 left, 1 right, 2 below
  const tx = side === 0 ? R(-1.6, -0.3) : side === 1 ? R(0.3, 1.6) : R(-1.3, 1.3);
  const start = side === 0 ? [R(-3.4, -2.3), R(0.55, 1.25), R(0.08, 0.35)] : side === 1 ? [R(2.3, 3.4), R(0.55, 1.25), R(0.08, 0.35)] : [tx + R(-0.4, 0.4), R(0.25, 0.55), R(0.25, 0.4)];
  const m = new THREE.Mesh(sphereGeo, dropMat); scene.add(m);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#8fd2ff', blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 })); scene.add(halo);
  drops.push({ m, halo, tx, tz: R(0.03, 0.12), start, r: R(0.035, 0.075), t0: R(1.0, 2.45), dur: R(0.55, 0.8), tu: rnd() });
}

// ---------- polymer strands ----------
const strandMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.15, 1.45, 1.55), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 });
const strands = [];
for (let i = 0; i < 70; i++) {
  const m = new THREE.Mesh(new THREE.BufferGeometry(), strandMat); m.frustumCulled = false; scene.add(m);
  strands.push({ m, x0: R(-1.5, 1.5), dir: rnd() < 0.5 ? -1 : 1, L: R(0.25, 0.6), k: R(3, 7), ph: R(0, 6.28), k2: R(2, 5), ph2: R(0, 6.28), d: R(0, 0.55), rad: R(0.0025, 0.0042) });
}
const TSEG = 56, RSEG = 5;
function buildStrand(s, t) {
  const pts = [];
  for (let k = 0; k <= 24; k++) {
    const u = k / 24; let x = s.x0 + s.dir * s.L * u; x = clamp(x, -FW + 0.05, FW - 0.05);
    const weave = ys(x) + MUC * (0.5 + 0.42 * Math.sin(u * Math.PI * s.k + s.ph));
    const y = lerp(filmBottom(s.x0, t) + 0.015, weave, sstep(0, 0.22, u));
    const z = 0.006 + 0.02 * (0.5 + 0.5 * Math.sin(u * Math.PI * s.k2 + s.ph2));
    pts.push(new THREE.Vector3(x, y, z));
  }
  s.m.geometry.dispose();
  s.m.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), TSEG, s.rad, RSEG, false);
}

// ---------- impact pulse ----------
const pulseL = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#fff4d6', blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
const pulseR = pulseL.clone(); pulseR.material = pulseL.material.clone();
const pulseC = pulseL.clone(); pulseC.material = pulseL.material.clone();
scene.add(pulseL, pulseR, pulseC);

// ---------- hero spheres ----------
const heroFinal = [[-1.55, 1.35, 3.0], [-0.78, 1.95, 3.35], [0.02, 1.22, 3.25], [0.82, 1.98, 3.3], [1.58, 1.38, 2.95]];
const heroR = [0.34, 0.3, 0.4, 0.31, 0.35];
const heroOrder = [1, 2, 0, 3, 4]; // which colour sits where
const heroes = PCOL.map((c, g) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.02, emissive: new THREE.Color(c), emissiveIntensity: 0.35, iridescence: 0.35, sheen: 0.4, sheenColor: new THREE.Color('#ffffff'), fog: false }));
  m.visible = false; scene.add(m);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: c, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0, fog: false }));
  scene.add(halo);
  // representative particle: the one of this colour nearest its slot
  const cand = parts.map((p, i) => [p, i]).filter(([p]) => p.g === g);
  const slotX = heroFinal[heroOrder.indexOf(g)][0] * 0.6;
  cand.sort((a, b) => Math.abs(a[0].x - slotX) - Math.abs(b[0].x - slotX));
  return { m, halo, pi: cand[0][1], slot: heroOrder.indexOf(g) };
});

// background bokeh
const bokeh = [];
for (let i = 0; i < 46; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color().setHSL(R(0.97, 1.08) % 1, 0.8, R(0.82, 0.92)), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: R(0.12, 0.32), fog: false }));
  const b = { s, p: [R(-9, 9), R(-2, 6), R(-9, -3)], sc: R(0.2, 0.9), ph: R(0, 6.28) };
  scene.add(s); bokeh.push(b);
}

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.4, 0.5, 1.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSweep: { value: -2 }, uSweepAmt: { value: 0 }, uFlare: { value: 0 }, uFlarePos: { value: new THREE.Vector2(0.8, 0.8) }, uAspect: { value: W / H } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSweep, uSweepAmt, uFlare, uAspect; uniform vec2 uFlarePos; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      float d = (vUv.x + vUv.y * 0.42) - uSweep;
      c.rgb += uSweepAmt * (exp(-d*d/0.0035) * vec3(1.0,0.96,0.86) + exp(-d*d/0.05) * vec3(1.0,0.85,0.7) * 0.35);
      vec2 p = (vUv - uFlarePos) * vec2(uAspect, 1.0); float r = length(p);
      vec3 fl = exp(-r*r/0.012) * vec3(1.0,0.96,0.9) * 1.3
              + exp(-abs(p.y)*90.0) * exp(-abs(p.x)*1.2) * vec3(1.0,0.86,0.72) * 0.9
              + exp(-abs(r-0.22)*40.0) * vec3(1.0,0.8,0.85) * 0.12
              + vec3(1.0,0.95,0.92) * 0.07;
      c.rgb += uFlare * fl;
      float v = smoothstep(1.25, 0.35, length((vUv - 0.5) * vec2(uAspect, 1.0)));
      c.rgb *= mix(0.86, 1.0, v);
      gl_FragColor = vec4(c.rgb, 1.0);
    }`
});
composer.addPass(finalPass);

// ---------- camera path ----------
const keys = [
  [0.0, [0.9, 7.6, 10.5], [0, 0.95, 0]],
  [0.62, [1.95, 1.6, 1.85], [1.45, 1.02, 0.0]],
  [1.05, [0.35, 1.2, 2.55], [0.0, 0.9, 0]],
  [3.05, [-0.15, 1.12, 2.05], [0.0, 0.93, 0]],
  [3.65, [0.98, 1.05, 0.64], [0.8, 0.975, 0]],
  [4.4, [0.7, 1.01, 0.56], [0.62, 0.955, 0]],
  [4.95, [0.0, 1.2, 2.2], [0, 0.9, 0]],
  [6.0, [0.05, 1.16, 2.0], [0, 0.9, 0]],
  [7.0, [0, 1.75, 7.3], [0, 1.2, 0]],
];
const eases = [eic, eio, x => lerp(x, eio(x), 0.6), eio, x => lerp(x, eio(x), 0.5), eio, x => lerp(x, eio(x), 0.5), eoc];
const v3 = a => new THREE.Vector3(...a);
function camAt(t) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const [ta, pa, qa] = keys[i], [tb, pb, qb] = keys[i + 1];
  const u = eases[i](clamp((t - ta) / (tb - ta)));
  return [v3(pa).lerp(v3(pb), u), v3(qa).lerp(v3(qb), u)];
}

// ---------- frame ----------
const dummy = new THREE.Object3D();
window.renderAt = function (t) {
  // camera
  const [cp, cq] = camAt(t);
  const shake = t > 4.15 ? 0.006 * Math.exp(-(t - 4.15) * 8) : 0;
  cp.x += shake * Math.sin(t * 90); cp.y += shake * Math.cos(t * 77);
  camera.position.copy(cp); camera.lookAt(cq);

  // slice into cross-section
  const cutZ = t < 0.5 ? 14 : t > 0.98 ? 0 : lerp(14, 0, eio((t - 0.5) / 0.48));
  gum.position.z = cutZ; gum.scale.z = cutZ + 6;
  mucus.position.z = cutZ; mucus.scale.z = cutZ + 6;
  const ff = Math.min(0.6, cutZ); film.position.z = ff; film.scale.z = ff + 0.6;

  // film material: dry opaque -> glossy glowing gel
  const sw = swell(t);
  filmMat.color.set('#eab51a').lerp(new THREE.Color('#ffd650'), sw);
  filmMat.roughness = lerp(0.88, 0.06, sw);
  filmMat.clearcoat = sw; filmMat.clearcoatRoughness = 0.04;
  filmMat.opacity = lerp(1.0, 0.5, sw);
  filmMat.emissiveIntensity = 0.02 + 0.45 * sw + (t > 4.15 ? 0.3 * Math.exp(-(t - 4.15) * 6) : 0);
  filmMat.depthWrite = sw < 0.3;
  const wv = clamp((t - 1.1) / 2.0);
  filmU.uWave.value = sstep(1.05, 1.35, t) * (1 - sstep(2.95, 3.3, t));
  filmU.uWaveP.value = lerp(-0.3, 1.3, (wv * 1.6) % 1);
  filmU.uWave2P.value = lerp(-0.3, 1.3, ((wv * 1.6) + 0.5) % 1);
  updateFilm(t);

  // mucus glow while strands weave + pulse
  const pulse = t > 4.15 ? Math.exp(-(t - 4.15) * 5) : 0;
  mucMat.emissiveIntensity = 0.05 + 0.25 * sstep(3.2, 4.0, t) * (1 - 0.5 * sstep(4.5, 5.5, t)) + 0.6 * pulse;
  mucMat.opacity = 0.26 + 0.12 * sstep(3.2, 4.1, t);

  // saliva
  for (const d of drops) {
    const k = clamp((t - d.t0) / d.dur);
    const tb = filmBottom(d.tx, t);
    const target = [d.tx, tb + 0.01 + d.tu * 0.04, d.tz];
    const mid = [(d.start[0] + target[0]) / 2, Math.max(d.start[1], target[1]) + 0.25, (d.start[2] + target[2]) / 2];
    const e = eoc(k);
    const q = (a, b, c) => (1 - e) * (1 - e) * a + 2 * (1 - e) * e * b + e * e * c;
    const absorb = sstep(0.82, 1.0, k);
    const sc = d.r * (1 - absorb) * (k > 0 ? 1 : 0) * (1 + 0.08 * Math.sin(t * 14 + d.t0 * 9));
    d.m.visible = sc > 0.0005;
    d.m.position.set(q(d.start[0], mid[0], target[0]), q(d.start[1], mid[1], target[1]), q(d.start[2], mid[2], target[2]));
    d.m.scale.set(sc * (1 + 0.25 * absorb), sc * (1 - 0.3 * absorb), sc);
    d.halo.position.set(target[0], target[1] - 0.005, target[2] + 0.02);
    const hk = sstep(0.8, 0.92, k) * (1 - sstep(0.95, 1.6, (t - d.t0) / d.dur));
    d.halo.material.opacity = 0.75 * hk; d.halo.scale.setScalar(0.08 + 0.16 * hk);
  }

  // strands
  for (const s of strands) {
    const g = clamp((t - (3.2 + s.d)) / 0.6);
    s.m.visible = g > 0;
    if (g > 0 && (t < 4.6 || !s.built)) { buildStrand(s, Math.min(t, 4.6)); s.built = t >= 4.6; }
    if (g > 0) s.m.geometry.setDrawRange(0, Math.floor(eoc(g) * TSEG) * RSEG * 6);
  }
  strandMat.opacity = 0.95 * (1 - 0.55 * sstep(4.5, 5.6, t)) * (1 - sstep(6.1, 6.6, t));

  // impact pulse
  const pk = clamp((t - 4.15) / 0.9);
  const pxp = eoc(pk) * 1.7;
  const po = t > 4.15 ? (1 - pk) : 0;
  pulseL.position.set(-pxp, ys(-pxp) + MUC * 0.6, 0.03); pulseR.position.set(pxp, ys(pxp) + MUC * 0.6, 0.03);
  pulseL.material.opacity = pulseR.material.opacity = 0.9 * po; pulseL.scale.set(0.35, 0.12, 1); pulseR.scale.set(0.35, 0.12, 1);
  pulseC.position.set(0.66, ys(0.66) + MUC, 0.04); pulseC.material.opacity = 0.8 * (t > 4.15 ? Math.exp(-(t - 4.15) * 7) : 0); pulseC.scale.set(0.5, 0.16, 1);

  // particles
  const cnt = [0, 0, 0, 0, 0];
  parts.forEach((p, i) => {
    const s = partState(p, t);
    let sc = s.scale;
    const hero = heroes.find(h => h.pi === i);
    if (hero && t > 6.0 + hero.slot * 0.06) sc = 0;
    dummy.position.set(s.x, s.y, s.z); dummy.scale.setScalar(sc); dummy.updateMatrix();
    pInst[p.g].setMatrixAt(cnt[p.g]++, dummy.matrix);
    // trails
    for (let j = 0; j < TR; j++) {
      const sj = partState(p, t - (j + 1) * 0.028);
      const moving = sj.k > 0 && sj.k < 1 ? 1 : (s.k > 0 && s.k < 1 ? 0.6 : 0);
      const f = (1 - j / TR) * moving * (sc > 0 ? 1 : 0);
      dummy.position.set(sj.x, sj.y, sj.z + 0.001); dummy.scale.setScalar(sj.scale * (1.25 - j * 0.09)); dummy.updateMatrix();
      trail.setMatrixAt(i * TR + j, dummy.matrix);
      const c = new THREE.Color(PCOL[p.g]).multiplyScalar(0.55 * f);
      trail.setColorAt(i * TR + j, c);
    }
    // surface pool once landed
    const land = sstep(0.85, 1.0, s.k) * (1 - sstep(6.2, 6.7, t));
    pools[i].position.set(s.x, ys(s.x) + 0.006, s.z + 0.002);
    pools[i].scale.set(0.11 + 0.05 * land, 0.03, 1);
    pools[i].material.opacity = 0.7 * land;
  });
  pInst.forEach(m => { m.instanceMatrix.needsUpdate = true; });
  trail.instanceMatrix.needsUpdate = true; trail.instanceColor.needsUpdate = true;
  pMats.forEach((m, g) => {
    const t0 = DR_START + g * DR_STAG;
    m.emissiveIntensity = 0.12 + 1.6 * sstep(t0 - 0.2, t0 + 0.05, t);
  });

  // heroes burst
  heroes.forEach((h, g) => {
    const tb = 6.0 + h.slot * 0.06;
    const k = clamp((t - tb) / 0.62);
    h.m.visible = t > tb;
    const p0 = partState(parts[h.pi], tb);
    const from = v3([p0.x, p0.y, p0.z]), to = v3(heroFinal[h.slot]);
    const pos = from.clone().lerp(to, eoc(k));
    pos.y += 0.05 * Math.sin(t * 2.2 + g) * k;
    h.m.position.copy(pos);
    const rr = lerp(p0.scale, heroR[h.slot], eob(clamp((t - tb) / 0.5)));
    h.m.scale.setScalar(rr);
    h.m.rotation.y = t * 0.6;
    h.halo.position.copy(pos).add(new THREE.Vector3(0, 0, -0.05));
    const flash = t > tb ? Math.exp(-(t - tb) * 6) : 0;
    h.halo.material.opacity = t > tb ? 0.35 + 0.65 * flash : 0;
    h.halo.scale.setScalar(rr * (3.0 + 4 * flash));
  });

  // fog washes gum away at the end so spheres float on coral
  scene.fog.density = 0.16 * sstep(6.05, 6.8, t);

  // bokeh drift
  bokeh.forEach(b => { b.s.position.set(b.p[0] + 0.3 * Math.sin(t * 0.4 + b.ph), b.p[1] + 0.2 * Math.cos(t * 0.5 + b.ph), b.p[2]); b.s.scale.setScalar(b.sc); });

  // light sweep (0-1s) + final flare
  finalPass.uniforms.uSweep.value = lerp(-0.6, 1.8, clamp((t - 0.66) / 0.42));
  finalPass.uniforms.uSweepAmt.value = sstep(0.62, 0.72, t) * (1 - sstep(1.0, 1.1, t)) * 1.3;
  finalPass.uniforms.uFlare.value = 0.85 * sstep(6.6, 6.86, t) * (1 - 0.35 * sstep(6.88, 7.0, t));
  bloom.strength = 0.38 + 0.2 * sstep(4.5, 5.0, t) + 0.3 * sstep(6.0, 6.8, t);

  const dbg = params.get('dbg');
  if (dbg === 'raw') renderer.render(scene, camera); else { bloom.enabled = dbg !== 'nobloom'; composer.render(); }
  return true;
};
window.ready = true;
</script></body></html>
